# Phone Game: lets Apache serve a built single-page website (Lovable/React) from /var/www/html,
# so addresses like /documentation open the site instead of "404 Not Found".
# Installed by install.sh as /etc/apache2/conf-available/phonegame-site.conf (a2enconf phonegame-site).
<Directory /var/www/html>
    FallbackResource /index.html
</Directory>

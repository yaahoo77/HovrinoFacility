; Phone Game story (installed by install.sh, included from extensions.conf).
;
;  player dials 7000 ─► game (re)starts ─► Sms ─► szyfr (repeats until the player hangs up) ─► player opens /documentation ─► documentation (once)
;
; Calls are made with call files (/usr/local/bin/phonegame-call). After each call the hangup
; handler below asks phonegame-call what comes next (a missed call is tried again later).

; What the player's phone may dial: only 7000.
[phonegame-phone]
exten => 7000,1,Answer()
 same => n,System(/usr/local/bin/phonegame-call start)
 same => n,Playback(beep)
 same => n,Hangup()
exten => _X.,1,Hangup(21)                       ; everything else is refused

; Where the game's calls go when the player answers. PG_MSG comes from the call file.
[phonegame]
exten => sms,1,Set(CHANNEL(hangup_handler_push)=phonegame-after,s,1(sms))
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/sms)
 same => n,Set(PG_HEARD=1)                       ; only reached if the player listened to the end
 same => n,Hangup()

; The clue plays over and over until the player hangs up (at most 15 minutes).
exten => szyfr,1,Set(CHANNEL(hangup_handler_push)=phonegame-after,s,1(szyfr))
 same => n,Set(TIMEOUT(absolute)=900)
 same => n,Answer()
 same => n,Set(PG_HEARD=1)                       ; for the clue, picking up is enough
 same => n,Wait(1)
 same => n(again),Playback(custom/szyfr)
 same => n,Wait(2)
 same => n,Goto(again)

exten => documentation,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/documentation)
 same => n,Hangup()

; The call was not answered (busy, no answer, phone app offline): try again later.
exten => failed,1,System(/usr/local/bin/phonegame-call after ${PG_MSG} missed)
 same => n,Hangup()

; After an answered call: plan the next one.
[phonegame-after]
exten => s,1,System(/usr/local/bin/phonegame-call after ${ARG1} ${IF($["${PG_HEARD}" = "1"]?heard:missed)})
 same => n,Return()

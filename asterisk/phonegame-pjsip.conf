; Phone Game: the player's phone line (installed by install.sh, included from pjsip.conf).
; The player logs in to MicroSIP / Zoiper / Linphone as 6001. Only an MD5 digest of the password is stored.

[6001]
type=endpoint
context=phonegame-phone          ; this line can only call 7000 (see phonegame-extensions.conf)
disallow=all
allow=ulaw,alaw
auth=6001-auth
aors=6001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid="Player" <6001>

[6001-auth]
type=auth
auth_type=md5
username=6001
realm=asterisk
md5_cred=@MD5_CRED@

[6001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
